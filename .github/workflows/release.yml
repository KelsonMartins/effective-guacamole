name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  checks: write

jobs:
  release:
    name: Build, Test & Publish (stable)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Bump minor/major version
        if: github.event_name == 'push'
        run: |
          CURRENT=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          if [ "$MINOR" -eq 9 ]; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
          else
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
          fi
          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.0"
          sed -i "s|<VersionPrefix>${CURRENT}</VersionPrefix>|<VersionPrefix>${NEW_VERSION}</VersionPrefix>|" Directory.Build.props
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
          git push
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --results-directory ./TestResults --coverage --coverage-output-format cobertura --report-trx --fail-fast --output Detailed

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-release.${{ github.run_number }}
          path: ./TestResults/*.trx

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-release.${{ github.run_number }}
          path: ./TestResults/**/*.cobertura.xml

      - name: Upload code coverage report to PR
        if: github.event_name == 'pull_request'
        uses: actions/upload-code-coverage@v1
        with:
          file: ./TestResults/**/*.cobertura.xml

      - name: Download all test results
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: ./TestResults

      - name: Publish test results
        if: github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          comment_mode: always

      - name: Pack
        if: github.event_name == 'push'
        run: dotnet pack --configuration Release --no-build --output ./artifacts

      - name: NuGet login (OIDC → temp API key)
        if: github.event_name == 'push'
        uses: NuGet/login@v1
        id: login
        with:
          user: KelsonMartins

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${NEW_VERSION}" ./artifacts/*.nupkg \
            --title "v${NEW_VERSION}" \
            --generate-notes \
            --latest

      - name: Push to NuGet.org
        if: github.event_name == 'push'
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{steps.login.outputs.NUGET_API_KEY}} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
