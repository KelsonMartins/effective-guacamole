name: Alpha Release

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  alpha:
    name: Build, Test & Publish (alpha)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Bump patch version
        if: github.event_name == 'push'
        run: |
          CURRENT=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i "s|<VersionPrefix>${CURRENT}</VersionPrefix>|<VersionPrefix>${NEW_VERSION}</VersionPrefix>|" Directory.Build.props
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
          git push
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:VersionSuffix=alpha.${{ github.run_number }}

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --results-directory ./TestResults --coverage --report-trx --fail-fast --output Detailed

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-alpha.${{ github.run_number }}
          path: ./TestResults/*.trx

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-alpha.${{ github.run_number }}
          path: ./TestResults/*.coverage

      - name: Download all test results
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: ./TestResults

      - name: Publish test results
        if: github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          comment_mode: always

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./artifacts /p:VersionSuffix=alpha.${{ github.run_number }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: KelsonMartins

      - name: Create GitHub Pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "v${NEW_VERSION}-alpha.${RUN_NUMBER}" ./artifacts/*.nupkg \
            --title "v${NEW_VERSION}-alpha.${RUN_NUMBER}" \
            --generate-notes \
            --prerelease

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{steps.login.outputs.NUGET_API_KEY}} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
