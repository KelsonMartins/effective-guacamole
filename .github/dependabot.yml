version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'develop'
    commit-message:
      prefix: 'chore(gh-actions): '
      include: 'scope'

  - package-ecosystem: 'nuget'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'develop'
    commit-message:
      prefix: 'chore(nuget): '
      include: 'scope'
